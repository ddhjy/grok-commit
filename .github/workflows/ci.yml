name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test -timeout 120s ./...
      - run: go vet ./...
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race -timeout 120s ./...
      - run: go build ./cmd/grok-commit
      - name: Unix installer and rollback
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: Windows installer and background rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
